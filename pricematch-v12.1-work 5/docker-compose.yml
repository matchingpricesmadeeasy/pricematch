services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pricematch
      POSTGRES_PASSWORD: pricematch
      POSTGRES_DB: pricematch
    ports:
      - "5432:5432"
    volumes:
      - pricematch_pg:/var/lib/postgresql/data
volumes:
  pricematch_pg:
